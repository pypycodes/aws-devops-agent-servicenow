AWSTemplateFormatVersion: '2010-09-09'
Description: AWS DevOps Agent Demo - Simple Lambda Architecture

Parameters:
  Env:
    Type: String
    Default: demo
  WebhookUrl:
    Type: String
    Description: AWS DevOps Agent webhook URL
  WebhookSecretParam:
    Type: String
    NoEcho: true
    Description: AWS DevOps Agent webhook HMAC secret
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda zip files
  AppCodeKey:
    Type: String
    Default: simple-lambda.zip
  WebhookCodeKey:
    Type: String
    Default: webhook-lambda.zip

Resources:

  # ══════════════════════════════════════════════
  # Encryption — Shared CMK for all resources
  # ══════════════════════════════════════════════
  DemoKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${Env} shared CMK for demo resources'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Env}-*'
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: '*'
          - Sid: AllowSNS
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: '*'

  # ══════════════════════════════════════════════
  # Storage Layer — S3 Bucket (versioned)
  # ══════════════════════════════════════════════
  ConfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Env}-simple-lambda-config-${AWS::AccountId}'
      AccessControl: Private
      # Block all public access to prevent accidental data exposure
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Enable SSE-S3 encryption at rest
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Enable versioning for data recovery
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - { Key: Environment, Value: !Ref Env }
        - { Key: Application, Value: simple-lambda }

  # Enforce HTTPS-only access to S3 bucket
  ConfigBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConfigBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ConfigBucket.Arn
              - !Sub '${ConfigBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  # ══════════════════════════════════════════════
  # Database Layer — DynamoDB (on-demand)
  # ══════════════════════════════════════════════
  StressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Env}-stress-test-table'
      BillingMode: PAY_PER_REQUEST    # On-demand: ~400 WRU, 40K RRU
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      # Enable encryption at rest with AWS managed KMS key
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: alias/aws/dynamodb
      # Enable point-in-time recovery for data protection
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: Environment, Value: !Ref Env }
        - { Key: Application, Value: simple-lambda }

  # ══════════════════════════════════════════════
  # Lambda Execution — SimpleLambda
  # ══════════════════════════════════════════════
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Env}-simple-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref LambdaAppPolicy

  LambdaAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Env}-simple-lambda-app-access'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:PutItem
            Resource: !GetAtt StressTable.Arn

  SimpleLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Env}-simple-lambda'
      Runtime: python3.11
      Handler: simple_lambda.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 90
      MemorySize: 128
      # Limit concurrency to prevent runaway invocations
      # ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref AppCodeKey
      Environment:
        Variables:
          STRESS_TABLE: !Ref StressTable
          STRESS_DURATION: '60'
      Tags:
        - { Key: Environment, Value: !Ref Env }
        - { Key: Application, Value: simple-lambda }

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Env}-simple-lambda'
      RetentionInDays: 14
      KmsKeyId: !GetAtt DemoKey.Arn

  # ══════════════════════════════════════════════
  # EventBridge — 1-min schedule trigger
  # ══════════════════════════════════════════════
  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Env}-simple-lambda-schedule'
      ScheduleExpression: 'rate(1 minute)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt SimpleLambda.Arn
          Id: SimpleLambdaTarget

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SimpleLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn

  # ══════════════════════════════════════════════
  # Monitoring — Alarms
  # ══════════════════════════════════════════════
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Env}-devops-agent-alarms'
      KmsMasterKeyId: !Ref DemoKey

  # M5/T5,T9: Restrict publish to CloudWatch alarms only; deny non-TLS
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [ !Ref AlarmTopic ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarmsOnly
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Env}-*'
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action:
              - sns:Publish
              - sns:Subscribe
            Resource: !Ref AlarmTopic
            Condition:
              Bool:
                aws:SecureTransport: false

  ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Env}-DynamoDB-WriteThrottle'
      AlarmDescription: DynamoDB write throttling detected
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - { Name: TableName, Value: !Ref StressTable }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]
      OKActions: [ !Ref AlarmTopic ]

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Env}-Lambda-Errors'
      AlarmDescription: Lambda function errors detected
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref SimpleLambda }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]
      OKActions: [ !Ref AlarmTopic ]

  # ══════════════════════════════════════════════
  # Webhook — alarm → AWS DevOps Agent
  # ══════════════════════════════════════════════
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Env}-devops-agent-webhook'
      # Encrypt secret with customer-managed KMS key
      KmsKeyId: !GetAtt DemoKey.Arn
      SecretString: !Sub '{"webhookUrl":"${WebhookUrl}","webhookSecret":"${WebhookSecretParam}"}'

  WebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Env}-webhook-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref WebhookSecretsPolicy

  WebhookSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Env}-webhook-secrets-read'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref WebhookSecret
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: !GetAtt DemoKey.Arn
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt WebhookDLQ.Arn

  # M10/T14: Dead-letter queue — Amazon Simple Queue Service (Amazon SQS) for failed webhook deliveries
  WebhookDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Env}-webhook-dlq'
      SqsManagedSseEnabled: false
      KmsMasterKeyId: !Ref DemoKey
      MessageRetentionPeriod: 1209600  # 14 days

  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Env}-devops-agent-webhook'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt WebhookLambdaRole.Arn
      Timeout: 30
      # Limit concurrency to prevent runaway invocations
      # ReservedConcurrentExecutions: 1
      DeadLetterConfig:
        TargetArn: !GetAtt WebhookDLQ.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref WebhookCodeKey
      Environment:
        Variables:
          SECRET_NAME: !Sub '${Env}-devops-agent-webhook'

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Env}-devops-agent-webhook'
      RetentionInDays: 14
      KmsKeyId: !GetAtt DemoKey.Arn

  WebhookSnsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmTopic

  WebhookSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: lambda
      Endpoint: !GetAtt WebhookFunction.Arn

Outputs:
  TableName:
    Value: !Ref StressTable
  BucketName:
    Value: !Ref ConfigBucket
  FunctionName:
    Value: !Ref SimpleLambda
  ScheduleRule:
    Value: !Ref ScheduleRule
  ThrottleAlarm:
    Value: !Ref ThrottleAlarm
  ErrorAlarm:
    Value: !Ref ErrorAlarm
