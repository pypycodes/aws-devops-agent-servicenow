AWSTemplateFormatVersion: '2010-09-09'
Description: AWS DevOps Agent Demo Use Case - EC2 CPU stress alarm

Parameters:
  Env:
    Type: String
    Default: demo
  IncidentTopicArn:
    Type: String
    Description: Shared incident routing SNS topic ARN
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    Description: CIDR block for the private stress-test VPC
  PrivateSubnetCidr:
    Type: String
    Default: 10.42.1.0/24
    Description: CIDR block for the private stress-test subnet
  InstanceType:
    Type: String
    Default: t3.nano
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
    Description: EC2 instance type used to simulate CPU stress
  CpuAlarmThreshold:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 100
    Description: CPUUtilization percentage that triggers the alarm
  CpuStressDurationSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    Description: Number of seconds to run CPU stress on first boot
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: !Sub '${Env}-ec2-cpu-stress-vpc' }
        - { Key: Environment, Value: !Ref Env }
        - { Key: UseCase, Value: ec2-cpu-stress }

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${Env}-ec2-cpu-stress-private-a' }
        - { Key: Environment, Value: !Ref Env }
        - { Key: UseCase, Value: ec2-cpu-stress }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${Env}-ec2-cpu-stress-private-rt' }
        - { Key: Environment, Value: !Ref Env }
        - { Key: UseCase, Value: ec2-cpu-stress }

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 CPU stress instance private access only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to private VPC endpoints
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - { Key: Name, Value: !Sub '${Env}-ec2-cpu-stress-sg' }
        - { Key: Environment, Value: !Ref Env }
        - { Key: UseCase, Value: ec2-cpu-stress }

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSM interface endpoint access from the private stress instance
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTPS from stress instance only
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      Tags:
        - { Key: Name, Value: !Sub '${Env}-ec2-cpu-stress-vpce-sg' }
        - { Key: Environment, Value: !Ref Env }
        - { Key: UseCase, Value: ec2-cpu-stress }

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Env}-ec2-cpu-stress-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${Env}-ec2-cpu-stress-profile'
      Roles:
        - !Ref InstanceRole

  CpuStressInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          cat >/tmp/stress.py <<'PY'
          import math
          import time

          end_time = time.time() + ${CpuStressDurationSeconds}
          while time.time() < end_time:
              for value in range(250000):
                  math.sqrt(value)
          PY
          chmod 700 /tmp/stress.py
          nohup python3 /tmp/stress.py >/var/log/cpu-stress.log 2>&1 &
      Tags:
        - { Key: Name, Value: !Sub '${Env}-ec2-cpu-stress' }
        - { Key: Environment, Value: !Ref Env }
        - { Key: UseCase, Value: ec2-cpu-stress }

  CpuSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Env}-EC2-CPU-Spike'
      AlarmDescription: EC2 CPU stress detected
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref CpuStressInstance
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref CpuAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref IncidentTopicArn
      OKActions:
        - !Ref IncidentTopicArn

Outputs:
  InstanceId:
    Value: !Ref CpuStressInstance
  CpuSpikeAlarm:
    Value: !Ref CpuSpikeAlarm
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
  SsmEndpointId:
    Value: !Ref SsmEndpoint
  SsmMessagesEndpointId:
    Value: !Ref SsmMessagesEndpoint
  Ec2MessagesEndpointId:
    Value: !Ref Ec2MessagesEndpoint